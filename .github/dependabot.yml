version: 2
updates:
  # Root JS package (library + dev tooling)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Android native modules
  - package-ecosystem: gradle
    directories:
      - "/native/android"
      - "/native/android-jsi"
      - "/native/androidTest"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Ruby tooling (CocoaPods etc.)
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
