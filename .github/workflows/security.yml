name: Security

on:
  push:
    branches: master
  pull_request:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  yarn-audit:
    name: yarn audit (runtime deps)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Audit runtime dependencies
        run: |
          set +e
          yarn audit --groups dependencies
          code=$?
          set -e
          # yarn audit exit code is a severity bitmask: 8 = high, 16 = critical
          if [ $(( code & 24 )) -ne 0 ]; then
            echo "::error::High or critical vulnerabilities found in runtime dependencies"
            exit 1
          fi

  osv-runtime:
    name: OSV scan (runtime deps)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install osv-scanner
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner
      # yarn.lock v1 is a flat list with no dev/prod distinction, so it cannot be
      # filtered. It is also not what consumers get: this is a library, so they
      # resolve our `dependencies` ranges themselves and never see our lockfile.
      # Resolve those ranges fresh and scan the result — that tree is what actually
      # ships. Dev and build tooling is left to Dependabot (see .github/dependabot.yml).
      - name: Resolve runtime dependency tree
        run: |
          mkdir -p "$RUNNER_TEMP/runtime"
          node -e '
            const pkg = require("./package.json")
            const { name, version, dependencies } = pkg
            require("fs").writeFileSync(
              `${process.env.RUNNER_TEMP}/runtime/package.json`,
              JSON.stringify({ name, version, dependencies }, null, 2),
            )
          '
          cd "$RUNNER_TEMP/runtime"
          npm install --package-lock-only --omit=dev --ignore-scripts
      - name: Scan runtime dependencies
        run: osv-scanner scan source -L "$RUNNER_TEMP/runtime/package-lock.json"
